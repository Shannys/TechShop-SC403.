<!doctype html><html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${titulo} + ' | TechShop'">TechShop</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
 <div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">✦ TechShop</a>
 <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
 <div id="menu" class="collapse navbar-collapse"><div class="navbar-nav ms-auto">
 <a class="nav-link" th:href="@{/}" th:text="#{nav.inicio}">Inicio</a>
 <a class="nav-link" th:href="@{/categoria/listado}" th:text="#{nav.categorias}">Categorías</a>
 <a class="nav-link" th:href="@{/producto/listado}" th:text="#{nav.productos}">Productos</a>
 </div></div></div>
</nav>
<div th:fragment="avisos" class="container mt-3">
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>
<footer th:fragment="footer" class="py-4 mt-auto bg-dark text-white-50">
 <div class="container d-flex justify-content-between flex-wrap gap-2"><small>© 2026 TechShop · Proyecto SC403</small><small>Semanas 1–5 · Spring Boot / Thymeleaf</small></div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body></html>
