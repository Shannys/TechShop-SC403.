<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head('Categorías')}"></head>
<body class="d-flex flex-column min-vh-100"><nav th:replace="~{general/fragmentos :: header}"></nav>
<div th:replace="~{general/fragmentos :: avisos}"></div>
<main class="container py-4 flex-grow-1">
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
 <div><h1 class="h2 mb-1">Categorías</h1><p class="text-muted mb-0">Listado y mantenimiento de categorías</p></div>
 <a class="btn btn-primary" th:href="@{/categoria/nuevo}">+ Agregar categoría</a>
</div>
<div class="card border-0 shadow-sm"><div class="table-responsive">
<table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Descripción</th><th>Activo</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="c : ${categorias}">
 <td th:text="${c.idCategoria}"></td><td th:text="${c.descripcion}"></td>
 <td><span class="badge" th:classappend="${c.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${c.activo} ? 'Sí' : 'No'"></span></td>
 <td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/categoria/modifica/{id}(id=${c.idCategoria})}">Modificar</a>
 <form th:action="@{/categoria/eliminar/{id}(id=${c.idCategoria})}" method="post" onsubmit="return confirm('¿Eliminar esta categoría?');">
 <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(categorias)}"><td colspan="4">No hay categorías.</td></tr></tbody></table></div></div>
</main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
